name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned to Ubuntu 24.04: ubuntu-latest now means Ubuntu 26, and Playwright 1.56 cannot install
# its browser dependencies there yet. Move to ubuntu-latest once Playwright supports it.
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meta-cv/backend
    env:
      NEO4J_TESTS: "0" # AuraDB contract tests need real credentials; the SQLite variants still run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-cv/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meta-cv/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meta-cv/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser smoke test (scripted demo)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meta-cv/backend/requirements.txt
      # playwright.config.ts starts the demo server with ../../venv (the repository root)
      - run: python -m venv venv && venv/bin/pip install -r meta-cv/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meta-cv/frontend/package-lock.json
      - working-directory: meta-cv/frontend
        run: npm ci
      - working-directory: meta-cv/frontend
        run: npx playwright install --with-deps chromium
      - working-directory: meta-cv/frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: meta-cv/frontend/test-results
          retention-days: 7
